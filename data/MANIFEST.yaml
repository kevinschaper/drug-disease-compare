# Pinned inputs for the MEDIC / Drug Approvals KP / dismech comparison.
# Regenerate checksums after `just fetch`; commit this file so the comparison is
# reproducible. The large input files themselves live under data/inputs/ and are
# gitignored.
inputs:
  # Each source is pinned at two releases: `old` (what the previous site was built
  # from, kept to characterize how the source changed) and `new` (drives the
  # head-to-head). `just fetch` lays them out as data/inputs/<source>/{old,new}/.
  medic_edges:
    description: >-
      MeDIC drug -> disease edges (biolink:treats; the redesign adds
      biolink:contraindicated_in).
    old:
      description: >-
        medic-ingest release: KGX JSONL, biolink:treats only, one edge per
        drug-disease pair (10,942 edges). Verbatim [FDA]/[EMA]/[PMDA] indication text
        in supporting_text; diseases to MONDO via SSSOM exact match.
      url: https://github.com/monarch-initiative/medic-ingest/releases/download/2026-06-19/medic_indication_edges.jsonl
      filename: medic/old/medic_edges.jsonl
      release: "2026-06-19"
      medic_version: "1.3.0"
      sha256: 8d92b96da800dac9e537558fb3767934d0df3836ebb250eb72ea945087fa319d
    new:
      description: >-
        MeDIC redesign (monarch-initiative/medic, branch medic2), built locally --
        not yet a published release. One edge per regulator *assertion* (14,674 edges,
        10,151 distinct triples): biolink:treats (11,360) + biolink:contraindicated_in
        (3,305), plus 9 research edges we skip. Each edge names its authority
        (medic_authority: FDA/EMA/PMDA/CDSCO), carries the label's verbatim section
        text, and a pair-level reliability tier (medic_pair_reliability HIGH/MEDIUM/LOW).
        Copied from the local build via `just sync-medic`.
      local_path: /home/kschaper/Monarch/medic-redesign/medic/exports/medic_edges.jsonl
      filename: medic/new/medic_edges.jsonl
      release: "2026-10-01 local (medic2@0453fd8)"
      medic_version: "1.0.1"
      biolink_version: "4.3.7"
      sha256: 9b9585ca626c3b79992326a8de062378d6f8372a4d8c3834074c4e4518f8d029

  dakp_edges:
    description: >-
      Drug Approvals KP. Primary source FAERS + DailyMed (and, from 1.x, EMA/EPAR);
      edges carry clinical_approval_status (approved_for_condition vs off_label_use)
      and number_of_cases. Predicates: biolink:applied_to_treat, biolink:treats,
      biolink:contraindicated_in.
    old:
      description: >-
        rtx.ai KGX build (infores:multiomics-drugapprovals), 73,999 edges. The
        zstd tarball expands to edges.jsonl / nodes.jsonl. The host is not always
        reachable; the extracted files were copied in by hand for this build.
      url: https://kgx-storage.rtx.ai/releases/dakp/2026_04_21/dakp.tar.zst
      filename: dakp/old/dakp_edges.jsonl
      nodes_filename: dakp/old/dakp_nodes.jsonl
      release: "2026_04_21"
      build_version: dakp_0.5.3_c3f74ab4_2025sep1_4.3.6
      tarball_sha256: a8e351668f58b188bddf9728d60db40fcc12002881e4f04d5dccb8276b08164c
      sha256: 5d1cdfdc5b643cc2c81dc40b9982108af127c15574da0b554221d53c9bd8ccef
      nodes_sha256: 6ad07e9e21a8880c9f6ccfd8940ab43d8621777c1af8fb3286ad155dba2b0060
    new:
      description: >-
        Hugging Face release (glusman-team/dakp, Tablassert build), rebranded
        infores:drugapprovals-kp. 131,678 edges, 15,883 nodes, Biolink 4.4.5.
        FDA_regulatory_approvals renamed regulatory_approvals (FDA + EMA numbers).
      url: https://huggingface.co/datasets/SkyeAv/drug-approvals-kp/resolve/main/1.16.0/DRUG_APPROVALS_KP_1.16.0.edges.ndjson
      nodes_url: https://huggingface.co/datasets/SkyeAv/drug-approvals-kp/resolve/main/1.16.0/DRUG_APPROVALS_KP_1.16.0.nodes.ndjson
      filename: dakp/new/dakp_edges.jsonl
      nodes_filename: dakp/new/dakp_nodes.jsonl
      release: "1.16.0"
      biolink_version: "4.4.5"
      sha256: 2f0f6f7f5611c898b27b12902e06b9bbd309131b284f32a0a6b2b0fe24cd4d27
      nodes_sha256: a35aca29f3790367c96684db846c6b22222d96c80b4133233b4ea8fc88a33f68

  dismech_edges:
    description: >-
      Monarch dismech KGX edges (mechanism-driven, curated, LLM-extracted with human
      validation). Only the drug-typed subset (CHEBI + NCIT drug concepts) of its treatment->disease edges
      (biolink:treats_or_applied_or_studied_to_treat) is comparable to MEDIC/DAKP; it
      is kept via the reconciler's drug filter. Edges carry real per-edge
      publications + supporting_text.
    old:
      url: https://github.com/monarch-initiative/dismech/releases/download/v0.1.30/dismech_edges.jsonl
      filename: dismech/old/dismech_edges.jsonl
      release: v0.1.30
      sha256: 6124e06d394697915f4afc5dbbcac864fa8cff8627d1d69a0af3d65be261ce7e
    new:
      url: https://github.com/monarch-initiative/dismech/releases/download/v0.1.42/dismech_edges.jsonl
      filename: dismech/new/dismech_edges.jsonl
      release: v0.1.42
      sha256: e7c1c8d87515f1b83730ea01994bfa705df606a24eeddfef6b9d058130e23507

  mondo_graph:
    description: >-
      MONDO is-a graph for disease-axis closure, taken from the release KGX
      nodes/edges. Direct biolink:subclass_of edges between MONDO terms; ancestors
      and descendants are the transitive closure. Lets a DAKP edge on a grouping
      disease be reconciled with a MEDIC edge on its subtype (and vice versa).
    mondo_release: latest
    edges:
      url: https://github.com/monarch-initiative/mondo/releases/latest/download/mondo_edges.tsv
      filename: mondo_edges.tsv
      sha256: d4efa50d131448792632d269fa499341debd74108243a3d79e8c6287cf12cf4b
    nodes:
      url: https://github.com/monarch-initiative/mondo/releases/latest/download/mondo_nodes.tsv
      filename: mondo_nodes.tsv
      sha256: c4dd473543e44ad5252aa019e11b22cc937b4d823d821ee697d6a977bf81bf61

  node_normalizer:
    description: >-
      SRI Node Normalizer, queried at build time to (a) canonicalize drugs to a
      single clique-preferred CURIE and (b) de-conflate the disease axis: for each
      disease CURIE we take the full clique and prefer its MONDO member, falling
      back to the original term (often HP) only when the clique contains no MONDO.
      This is what undoes the MONDO/HP same-name conflation MONDO-centrically.
      Responses are cached to data/nodenorm_cache.json (gitignored).
    endpoint: https://nodenormalization-sri.renci.org/get_normalized_nodes
    conflate: true
    drug_chemical_conflate: true

  drug_groups:
    description: >-
      Drug-axis collapse, queried at build time (toggle with cli build
      --no-drug-collapse). The Node Normalizer keeps a prodrug/salt/stereoisomer
      separate from its parent, so the same drug recorded two ways reads as a
      disagreement. Each canonical drug is mapped to its FDA/GSRS active moiety
      (pivoting on UNII, recovered via RxNorm when a clique lacks one), with an
      ion guard that rejects moieties of <3 heavy atoms (bare metal cations, NO)
      to avoid over-merging therapeutically distinct salts. This is a flagged,
      experiment-derived inference surfaced separately (drug_group / n_group /
      drug_note), NEVER folded into exact agreement. Compared against RxNorm
      ingredient and ChEBI functional-parent in experiments/drug_collapse.py;
      active moiety chosen for coverage + lowest false-merge rate. Responses
      cached to data/drug_groups_cache.json (gitignored).
    active_moiety: https://gsrs.ncats.nih.gov/api/v1/substances
    rxnorm: https://rxnav.nlm.nih.gov/REST
    chebi_ols: https://www.ebi.ac.uk/ols4/api
    min_moiety_heavy_atoms: 3
